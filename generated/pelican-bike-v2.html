<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 v2 — SVG 版</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#7ec8e3 0%, #b8e3f5 55%, #9fd48a 55%, #7bb661 100%);
    overflow: hidden;
  }
  svg { width: min(90vw, 800px); height: auto; }

  /* 太阳 */
  .sun { animation: sunPulse 4s ease-in-out infinite; transform-origin: 700px 90px; }
  @keyframes sunPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* 云飘动 */
  .cloud { animation: drift 18s linear infinite; }
  .cloud.c2 { animation-duration: 26s; animation-delay: -10s; }
  @keyframes drift {
    from { transform: translateX(-200px); }
    to   { transform: translateX(900px); }
  }

  /* 车轮转 */
  .wheel { animation: spin 0.7s linear infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 蹬腿 */
  .crank { animation: spin 0.7s linear infinite; transform-origin: center; transform-box: fill-box; }

  /* 鹈鹕颠簸 + 翅膀 */
  .pelican { animation: bob 0.7s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .wing { animation: flap 0.7s ease-in-out infinite; transform-origin: 300px 250px; }
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }

  /* 路面滚动 */
  .road { animation: ground 0.7s linear infinite; }
  @keyframes ground { from { transform: translateX(0); } to { transform: translateX(-80px); } }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 太阳 -->
  <g class="sun">
    <circle cx="700" cy="90" r="42" fill="#ffd54f"/>
    <g stroke="#ffd54f" stroke-width="6" stroke-linecap="round">
      <line x1="700" y1="20" x2="700" y2="38"/>
      <line x1="700" y1="142" x2="700" y2="160"/>
      <line x1="630" y1="90" x2="648" y2="90"/>
      <line x1="752" y1="90" x2="770" y2="90"/>
      <line x1="651" y1="41" x2="663" y2="53"/>
      <line x1="737" y1="127" x2="749" y2="139"/>
      <line x1="651" y1="139" x2="663" y2="127"/>
      <line x1="737" y1="53" x2="749" y2="41"/>
    </g>
  </g>

  <!-- 云 x2 -->
  <g class="cloud" fill="#ffffff" opacity="0.9">
    <ellipse cx="120" cy="80" rx="55" ry="22"/>
    <ellipse cx="160" cy="65" rx="40" ry="20"/>
    <ellipse cx="80"  cy="68" rx="35" ry="16"/>
  </g>
  <g class="cloud c2" fill="#ffffff" opacity="0.75">
    <ellipse cx="150" cy="150" rx="45" ry="18"/>
    <ellipse cx="185" cy="138" rx="32" ry="15"/>
  </g>

  <!-- 路面 -->
  <rect x="0" y="430" width="800" height="70" fill="#6b6b6b"/>
  <g class="road">
    <g fill="#ffe9a8">
      <rect x="0"   y="462" width="46" height="7" rx="3"/>
      <rect x="80"  y="462" width="46" height="7" rx="3"/>
      <rect x="160" y="462" width="46" height="7" rx="3"/>
      <rect x="240" y="462" width="46" height="7" rx="3"/>
      <rect x="320" y="462" width="46" height="7" rx="3"/>
      <rect x="400" y="462" width="46" height="7" rx="3"/>
      <rect x="480" y="462" width="46" height="7" rx="3"/>
      <rect x="560" y="462" width="46" height="7" rx="3"/>
      <rect x="640" y="462" width="46" height="7" rx="3"/>
      <rect x="720" y="462" width="46" height="7" rx="3"/>
      <rect x="800" y="462" width="46" height="7" rx="3"/>
    </g>
  </g>

  <!-- 自行车 -->
  <g stroke="#2b2b2b" fill="none">
    <!-- 后轮 -->
    <g class="wheel">
      <circle cx="250" cy="400" r="62" stroke-width="9"/>
      <circle cx="250" cy="400" r="50" stroke-width="3" stroke-dasharray="6 8" stroke="#777"/>
      <circle cx="250" cy="400" r="7" fill="#555" stroke="none"/>
      <line x1="250" y1="338" x2="250" y2="462" stroke="#999" stroke-width="3"/>
      <line x1="188" y1="400" x2="312" y2="400" stroke="#999" stroke-width="3"/>
    </g>
    <!-- 前轮 -->
    <g class="wheel">
      <circle cx="470" cy="400" r="62" stroke-width="9"/>
      <circle cx="470" cy="400" r="50" stroke-width="3" stroke-dasharray="6 8" stroke="#777"/>
      <circle cx="470" cy="400" r="7" fill="#555" stroke="none"/>
      <line x1="470" y1="338" x2="470" y2="462" stroke="#999" stroke-width="3"/>
      <line x1="408" y1="400" x2="532" y2="400" stroke="#999" stroke-width="3"/>
    </g>
    <!-- 车架 -->
    <g stroke="#e74c3c" stroke-width="10" stroke-linecap="round">
      <line x1="250" y1="400" x2="330" y2="300"/>   <!-- 后轮到座管 -->
      <line x1="330" y1="300" x2="440" y2="300"/>   <!-- 上管 -->
      <line x1="250" y1="400" x2="360" y2="400"/>   <!-- 后下叉 -->
      <line x1="360" y1="400" x2="330" y2="300"/>   <!-- 座管 -->
      <line x1="360" y1="400" x2="440" y2="300"/>   <!-- 下管 -->
      <line x1="440" y1="300" x2="470" y2="400"/>   <!-- 前叉 -->
    </g>
    <!-- 车把和车座 -->
    <line x1="440" y1="300" x2="452" y2="268" stroke="#2b2b2b" stroke-width="8" stroke-linecap="round"/>
    <line x1="432" y1="266" x2="478" y2="272" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round"/>
    <line x1="330" y1="300" x2="322" y2="278" stroke="#2b2b2b" stroke-width="8" stroke-linecap="round"/>
    <line x1="298" y1="276" x2="344" y2="276" stroke="#3b2b20" stroke-width="12" stroke-linecap="round"/>
    <!-- 曲柄 + 脚踏 -->
    <g class="crank">
      <line x1="360" y1="400" x2="392" y2="426" stroke="#444" stroke-width="7" stroke-linecap="round"/>
      <line x1="360" y1="400" x2="328" y2="374" stroke="#444" stroke-width="7" stroke-linecap="round"/>
      <rect x="384" y="420" width="22" height="9" rx="4" fill="#222" stroke="none"/>
      <rect x="314" y="368" width="22" height="9" rx="4" fill="#222" stroke="none"/>
    </g>
  </g>

  <!-- 鹈鹕 -->
  <g class="pelican">
    <!-- 腿（连到曲柄） -->
    <g stroke="#f39c12" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="322" y1="330" x2="392" y2="426"/>
      <line x1="322" y1="330" x2="328" y2="374"/>
    </g>
    <!-- 尾巴 -->
    <path d="M 262 300 Q 230 280 236 310 Q 242 330 268 328 Z" fill="#e8e8e0" stroke="#c9c9bd" stroke-width="3"/>
    <!-- 身体 -->
    <ellipse cx="310" cy="298" rx="62" ry="42" fill="#ffffff" stroke="#c9c9bd" stroke-width="4"/>
    <!-- 翅膀 -->
    <path class="wing" d="M 300 250 Q 258 258 262 292 Q 290 306 322 288 Q 330 262 300 250 Z"
          fill="#f2f2ea" stroke="#c9c9bd" stroke-width="4"/>
    <!-- 脖子 -->
    <path d="M 340 270 Q 356 240 352 214" stroke="#ffffff" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M 340 270 Q 356 240 352 214" stroke="#c9c9bd" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- 头 -->
    <circle cx="352" cy="200" r="24" fill="#ffffff" stroke="#c9c9bd" stroke-width="4"/>
    <!-- 眼睛 -->
    <circle cx="362" cy="194" r="4.5" fill="#222"/>
    <!-- 大嘴 + 喉囊 -->
    <path d="M 366 196 L 452 204 L 368 210 Z" fill="#f5a623" stroke="#d98c12" stroke-width="2"/>
    <path d="M 368 208 Q 400 240 446 206 Q 410 216 368 208 Z" fill="#f7b944" stroke="#d98c12" stroke-width="2"/>
  </g>
</svg>
</body>
</html>
